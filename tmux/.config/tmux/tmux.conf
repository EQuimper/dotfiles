# Enable True color and modern terminal features
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",wezterm:RGB"
set -as terminal-features ",wezterm:hyperlinks:usstyle:RGB:clipboard"
set -gq allow-passthrough all
set-option -g default-shell "/bin/zsh"

# Forward terminal focus events to apps inside tmux (nvim, Claude, Codex)
set -g focus-events on

# Status bar refresh every 2s so tmux-agent-status stays current
set -g status-interval 2

set -g base-index 1
set -g pane-base-index 1

set -g history-limit 100000
set -g renumber-windows on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g display-time 3000
set -g extended-keys on

# Rebind leader key
set -g prefix C-a
# set -g prefix C-b

unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind v
bind v copy-mode

# resizing panes with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# maximize panes
bind -r m resize-pane -Z

# mouse support
set -g mouse on

# Visual-only agent awareness: flash window in tab bar when bell rings in another window
setw -g monitor-bell on
setw -g monitor-activity off
set -g visual-bell off
set -g visual-activity off
set -g bell-action other

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Quick session switching is handled by tmux-sessionx (prefix + o)
bind-key n command-prompt "new-session -s '%%'"

# Per-pane title bar so you can label panes "claude" / "codex" / "tests"
setw -g pane-border-status top
setw -g pane-border-format " #{?pane_active,#[fg=#{@thm_peach}#,bold],#[fg=#{@thm_overlay_0}]}#{pane_index}: #{pane_title} "

# prefix + T : rename focused pane title
bind T command-prompt -p "pane title:" "select-pane -T '%%'"

# prefix + Y : toggle broadcast input to all panes in the window
# (S is reserved for the agent switcher popup below)
bind Y setw synchronize-panes \; display "sync-panes: #{?pane_synchronized,ON,OFF}"

# prefix + g : floating shell popup at current pane's path
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# tmux plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin "christoomey/vim-tmux-navigator"

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins
# tmux-agent-status is wired manually below to avoid its sidebar-first startup.
# Keep ~/.config/tmux/.tmux/plugins/tmux-agent-status installed for these scripts.

# Quality-of-life plugins for agent workflows
set -g @plugin 'fcsonline/tmux-thumbs'        # vimium-style hint copy of paths/URLs
set -g @plugin 'tmux-plugins/tmux-yank'       # reliable system-clipboard copy
set -g @plugin 'tmux-plugins/tmux-open'       # open URL/file under cursor in copy-mode
set -g @plugin 'tmux-plugins/tmux-logging'    # log/screenshot/save pane history to file
set -g @plugin 'omerxx/tmux-floax'            # floating scratch pane

# tmux-thumbs: prefix + F to highlight matches, type the hint to copy match to clipboard
set -g @thumbs-key F
set -g @thumbs-alphabet qwerty-homerow
set -g @thumbs-command 'echo -n {} | pbcopy'

# tmux-floax: use prefix + b (b = "box") to avoid conflict with bind-key p (previous-window)
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'b'
set -g @floax-change-path 'true'

# tmux-logging: rebind from default Shift+P to L to avoid conflict with park-session
set -g @logging-key 'L'

set -g @plugin 'catppuccin/tmux'
if-shell '[ "$(cat ~/.config/theme/current 2>/dev/null)" = "light" ]' \
  "set -g @catppuccin_flavor 'latte'" \
  "set -g @catppuccin_flavor 'mocha'"
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

# Show tmux window names instead of pane titles in the window list
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# Agent cockpit
bind-key C new-window -n "claude" -c "#{pane_current_path}" "claude"
bind-key G new-window -n "codex" -c "#{pane_current_path}" "codex"
bind-key S display-popup -E -w 60 -h 14 -T " Switch Agent " -S fg=colour250 -s fg=colour250 "~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/hook-based-switcher.sh"
bind-key N run-shell "~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/next-done-project.sh"
bind-key W run-shell "~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/wait-session.sh"
bind-key P run-shell "~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/park-session.sh"
bind-key A display-message "Agent sidebar disabled; use prefix + S for agent switcher"
bind-key p previous-window

# prefix + t : toggle dark/light theme (reloads nvim/tmux/wezterm)
bind t run-shell "~/.config/theme/bin/theme toggle"

# # Configure Catppuccin
# set -g @catppuccin_flavor "mocha"
# set -g @catppuccin_status_background "none"
# set -g @catppuccin_window_status_style "none"
# set -g @catppuccin_pane_status_enabled "off"
# set -g @catppuccin_pane_border_status "off"

# Configure Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #W },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #W }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 160
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
set -ga status-right " #(~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/status-line.sh)"


# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single

# window look and feel
# Preserve manual window names instead of auto-renaming from the active command
set -wg automatic-rename off
set -g allow-rename off
run-shell 'tmux list-sessions -F "#{session_id}" | while read sid; do tmux set-option -t "$sid" allow-rename off; done'
run-shell 'tmux list-windows -a -F "#{window_id}" | while read wid; do tmux set-window-option -t "$wid" automatic-rename off; done'

set-hook -g after-new-session 'set -g allow-rename off'
set-hook -g after-new-window 'set -w automatic-rename off'

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"


set-hook -g after-resize-pane "if-shell \"tmux list-panes -F '#F' | grep -q Z\" \"set -g status off; setw -g pane-border-status off\" \"set -g status on; setw -g pane-border-status top\""

# Clear stale agent sidebar hooks before TPM re-sources plugins.
set-hook -gu session-created
set-hook -g session-created "run-shell ~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/daemon-monitor.sh"
set-hook -ga session-created "run-shell -b ~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/sidebar-signal.sh collect"
set-hook -ga session-created "run-shell -b ~/.config/tmux/scripts/cleanup-agent-panes.sh"
set-hook -ga after-new-window "run-shell -b ~/.config/tmux/scripts/cleanup-agent-panes.sh"
set-hook -ga after-new-session "run-shell -b ~/.config/tmux/scripts/cleanup-agent-panes.sh"
run-shell -b ~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/sidebar-collector.sh
run-shell -b ~/.config/tmux/.tmux/plugins/tmux-agent-status/scripts/daemon-monitor.sh
run-shell -b ~/.config/tmux/scripts/cleanup-agent-panes.sh

run '~/.config/tmux/.tmux/plugins/tpm/tpm' # always keep this line last
